<!doctype html>
<!-- FILE: index.html. PURPOSE: responsive HandCrafts landing page.
     SECTIONS: header/navigation, hero, category gallery, footer. -->
<html lang = "en">
<head>
<meta charset = "UTF-8">
             <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
                         <meta http-equiv = "X-UA-Compatible" content = "ie=edge">
             <title>HandCrafts</title>
             <link rel="icon" type="image/webp" sizes="192x192" href="favicon.webp">
             <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
	<link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel = "stylesheet">
	<link rel = "stylesheet" href = "css/style.css">
	<!-- Картинка каталога под мышью увеличивается в 2,5–3 раза (только мышь; на телефоне ничего не меняется) -->
	<script src = "js/hover-zoom.js" defer></script>
</head>
<body>
<header class = "container">
	<div class = "row align-items-sm-center">
		<h2 class = "col-sm-4 fw-bold">HandCrafts</h2>
		<nav class = "row col-sm-8">
			<a class="col-sm-2 offset-sm-6" href="#newest">newest</a>
			<a class="col-sm-2" href="#catalog">catalog</a>
			<a class="col-sm-2" href="#contact">contact</a>
		</nav>
	</div>
</header>
<section id="newest" class = "container-fluid jumbotron text-center d-flex flex-column align-items-center justify-content-center">
	<h1>HandCrafts</h1>
	<h2>This year best</h2>
	<a class = "btn btn-primary" href = "#catalog">See all</a>
</section>
<section id="catalog" class = "container text-center" aria-label="Craft categories">
	<div class = "row">
		<figure class = "col-sm-6">
			<h3>Kitchen</h3>
			<img class = "w-100" src = "images/kitchen.jpg" alt = "Kitchen">
		</figure>
		<figure class = "col-sm-6">
			<h3>Woodwork</h3>
			<img class = "w-100" src = "images/woodwork.jpg" alt = "Woodwork">
		</figure>
		<figure class = "col-sm-6">
			<h3>Gifts</h3>
			<img class = "w-100" src = "images/gifts.jpg" alt = "Gifts">
		</figure>
		<figure class = "col-sm-6">
			<h3>Antique</h3>
			<img class = "w-100" src = "images/antique.jpg" alt = "Antique">
		</figure>
		
	</div>
</section>
<footer id="contact" class="container">
	<div class="row">
		<h4 class="col-sm-4">&copy; HandCrafts · <a class="repo-link" href="https://github.com/DubnovAlexey/L_12_HandCrafts" target="_blank" rel="noopener noreferrer">Source code</a></h4>
		<ul class="row col-sm-8 list-unstyled">
			<li class="col-sm-1 offset-sm-9"><img src="images/twitter.svg" alt="twitter"></li>
			<li class="col-sm-1"><img src="images/facebook.svg" alt="facebook"></li>
			<li class="col-sm-1"><img src="images/instagram.svg" alt="instagram"></li>
		</ul>
	</div>
</footer>
</body>
</html>
